    """날짜 검색 옵션 - to (date_created를 기준으로 검색한다)"""
    date_to: CrTimestamp

    """최대 개수 (default: 100)"""
    limit_count: Int

    """건너뛰는 개수"""
    skip_count: Int

    """주문 상품 문의 타입"""
    type: OrderItemInquiryType

    """삭제된 문의를 포함한다"""
    include_deleted: Boolean
  ): OrderItemInquiryList!
  product_question(id: ID!): ProductQuestion
  product_question_list(limit_count: Int, skip_count: Int, date_created_gte: CrTimestamp, date_created_lte: CrTimestamp): ProductQuestionList!

  """상품 목록을 반환한다"""
  product_list: ProductList!

  """상품 정보를 반환한다. 상품이 없으면 null을 반환한다."""
  product(id: ID!): Product

  """조건에 해당하는 상품 ID를 반환한다."""
  getProductId(
    """호스팅사(cafe24, makeshop등)  product_no"""
    external_product_id: String!
  ): ID

  """외부 상품과의 리뷰 매핑 정보를 조회한다."""
  product_review_relation_list(input: OpenApiProductReviewRelationListInput, paginationInput: OpenApiPaginationInput!): OpenApiProductReviewRelationList!

  """사이즈 카테고리를 조회한다."""
  size_category_list: [SizeCategory!]!

  """간략화된 상품 기본정보 목록을 반환한다. DIRECT 샵 전용이며, 아이템(item) 정보는 포함하지 않는다."""
  product_summary_list(input: ProductSummaryListInput!): ProductSummaryList!

  """승인된 브랜드 목록을 조회한다."""
  allowed_brand_list: [ShopAllowedBrandForOpenApi!]! @deprecated(reason: "shop 을 사용해주세요")

  """판매 가능한 채널 목록을 조회한다."""
  site_country_list: [ShopSiteCountryForOpenApi!]! @deprecated(reason: "shop 을 사용해주세요")

  """access key 를 통한 스토어 정보 조회"""
  shop: ShopForOpenApi

  """배송지 조회"""
  shop_shipping_address_list(
    """
    반환할 최대 갯수
    - Default: 10
    - Max: 50
    """
    limit_count: Int

    """건너뛸 갯수"""
    skip_count: Int
  ): ShopShippingAddressList!
  product_review_list(input: ProductReviewListInput!, pagination: ProductReviewCursorPaginationInput!, order: ProductReviewListOrderType): ProductReviewList!

  """
  주어진 조건 모두에 일치하는 주문 정산 아이템 목록을 반환한다.
  조건이 주어지지 않으면 모든 주문 정산 아이템을 반환한다.
  """
  order_settlement_item_list(
    """날짜 검색 옵션"""
