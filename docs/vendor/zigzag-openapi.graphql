  ): OrderItemList!

  """교환 주문 목록을 반환한다."""
  exchange_new_order_item_list(
    """[from] 주문생성일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_ymd_from: Int

    """[to] 주문생성일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_ymd_to: Int

    """[from] 교환 요청일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_requested_ymd_from: Int

    """[to] 교환 요청일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_requested_ymd_to: Int

    """교환 주문 아이템 번호 목록"""
    order_item_number_list: [String!]

    """주문번호"""
    order_number: String

    """교환 주문 아이템 상태"""
    status: ExchangeOrderItemStatus

    """목록 개수 제한"""
    limit_count: Int

    """주어진 수의 레코드를 건너띄고 반환한다"""
    skip_count: Int
  ): ExchangeOrderItemList!
  zigzin_return_order_qc_item_list(
    """[from] 반품검수 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_marked_return_qc_ymd_goe: Int!

    """[to] 반품검수 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_marked_return_qc_ymd_lt: Int!

    """목록 개수 제한"""
    limit_count: Int!

    """주어진 수의 레코드를 건너띄고 반환한다"""
    skip_count: Int!
  ): ZigzinReturnOrderQcItemList

  """카테고리 정보를 반환한다."""
  category: Category!

  """상품 필수정보제공고시 템플릿을 조회한다."""
  getAllEssentialTemplate: [CategoryEssentialTemplate!]!

  """id에 해당하는 주문 상품 문의 정보를 받는다."""
  order_item_inquiry(
    """상품 문의 ID"""
    id: ID!
  ): OrderItemInquiry!

  """
  주어진 조건 모두에 일치하는 주문 상품 문의 목록을 받는다.
  조건이 주어지지 않으면 모든 주문 상품 문의 목록을 반환한다. (default limit count: 100)
  """
  order_item_inquiry_list(
    """날짜 검색 옵션 - from (date_created를 기준으로 검색한다)"""
