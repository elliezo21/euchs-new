    """[from] 취소/반품 완료일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_request_completed_ymd_from: Int

    """[to] 취소/반품 완료일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_request_completed_ymd_to: Int

    """아이템에 대한 요청의 종류"""
