    """[to] 취소/반품 요청일 기준의 날짜 검색 옵션"""
    date_requested_to: CrTimestamp

    """[from] 반품수거중 처리일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
    date_marked_return_collecting_ymd_from: Int

    """[to] 반품수거중 처리일 기준의 날짜 검색 옵션 (yyyymmdd 기준으로 검색)"""
