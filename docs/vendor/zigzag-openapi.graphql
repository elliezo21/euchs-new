    shop_id: ID

    """날짜 검색 옵션"""
    date_query_options: OrderSettlementShopDateQueryOptions

    """limit_count"""
    limit_count: Int

    """skip_count"""
    skip_count: Int
  ): OrderSettlementShopList!
