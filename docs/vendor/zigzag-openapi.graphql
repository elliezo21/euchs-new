type Mutation {
  """
  해당 주문 아이템 목록의 상태를 '배송 대기중'으로 변경한다.
  [error_code]
  - order_item_not_found: 해당하는 조건의 주문 아이템을 찾을 수 없는 경우
  - order_item_invalid_status: 주문완료/배송중 상태가 아닌 주문 아이템이 포함된 경우
  - order_item_already_requested: 이미 활성화된 요청(e.g 취소/반품 요청)이 있는 주문 아이템이 포함된 경우
  - invalid_parameter: 주문 아이템 목록이 500개를 초과하는 경우
  """
  markOrderItemListAsAwaitingShipment(input: MarkOrderItemListAsAwaitingShipmentInput!): Boolean!

  """
  해당 주문 아이템 목록의 운송장 정보를 등록한다.
  [error_code]
  - order_item_not_found: 해당 조건의 주문 아이템이 없는 경우
  - order_item_invalid_status: 주문완료/배송 대기중 외 상태의 주문 아이템이 포함된 경우
  - order_item_already_requested: 요청(e.g 취소)중인 주문 아이템이 포함된 경우
  """
  updateInvoiceOfOrderItemList(input: UpdateInvoiceOfOrderItemListInput!): Boolean!

  """
  해당 주문 아이템 목록의 상태를 '반품 수거중'으로 변경한다.
  [error_code]
  - order_item_not_found: 해당하는 조건의 주문 아이템을 찾을 수 없는 경우
  - order_item_invalid_status: 배송중/배송완료 상태가 아닌 주문 아이템이 포함된 경우
  - order_item_not_requested: 반품 요청이 되지 않은 주문 아이템이 포함된 경우
  """
  markOrderItemListAsReturnCollecting(input: MarkOrderItemListAsReturnCollectingInput!): Boolean!

  """
  해당 상품주문 목록의 상태를 '반품 수거 완료'로 변경한다.
  [error_code]
  - order_item_not_found: 해당하는 조건의 상품주문을 찾을 수 없는 경우
  - order_item_invalid_status: 반품 수거중 상태가 아닌 상품주문이 포함된 경우
  - order_item_not_requested: 반품 요청이 되지 않은 상품주문이 포함된 경우
  """
  markOrderItemListAsReturnCollected(input: MarkOrderItemListAsReturnCollectedInput!): Boolean!

  """
  해당 상품주문목록을 반품 완료 시키고 결제를 환불한다
  [error_code]
  - order_not_found: 해당하는 조건의 주문을 찾을 수 없는 경우
  - order_item_not_found: 해당하는 조건의 상품주문을 찾을 수 없는 경우
  - order_invalid_refund_amount: 환불할 금액이 없는 경우
  - order_item_invalid_status: 상품주문의 상태가 요청 할 수 없는 상태인 경우
  - user_payment_cancel_failed: 환불에 실패하였습니다. 지그재그에 문의해주세요.
  - invalid_order_item_request_category: 요청 사유가 유효하지 않습니다. 동일한 귀책의 요청 사유인지 확인해주세요.
  - invalid_shipping_fee_additional_charge_method: 반품비용 지불방법이 유효하지 않습니다.
  """
  returnAndRefundOrderItemList(input: ReturnAndRefundOrderItemListInput!): Boolean!

  """
  해당 상품주문 목록의 반품을 요청한다.
  [error_code]
   - order_not_found: 해당하는 조건의 주문을 찾을 수 없는 경우
   - order_item_not_found: 해당하는 조건의 상품주문을 찾을 수 없는 경우
   - order_item_invalid_status: 상품주문의 상태가 요청 할 수 없는 상태인 경우
   - order_item_already_requested: 이미 다른 타입의 요청이 진행중인 상품주문이 존재하는 경우
  """
  requestReturnOrderItemList(input: RequestReturnOrderItemListInput!): Boolean!

  """
  아래 케이스에 해당하는 상품주문요청의 상태 진행을 보류한다.
  1. 취소요청 -> 취소완료
  2. 반품요청 -> 반품수거중
  3. 반품수거완료 -> 반품완료
  [error_code]
