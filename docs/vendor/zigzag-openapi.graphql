    """
    반품/교환비용 지불방식을 "바로결제" 로 선택 후 유저의 결제를 대기중인 경우, 해당 바로결제 대기 상태의 상품주문을 조회할지 여부
    - true: 해당 바로결제 대기 상태의 상품주문만을 조회
    - false: 해당 바로결제 대기 상태의 상품주문을 제외한 상품주문을 조회
      - 해당 인자 선언 없을 시, 기본 값 false
