  - USER: 구매자 귀책
"""
enum OrderRefundResponsibility {
  SELLER
  USER
}

"""
배송비 추가 지불방식 정보
  - 초도/반품/교환 배송비 각 시점별 결제수단을 나타냅니다.
"""
